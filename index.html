<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅ガチャ</title>
  <meta name="description" content="ガチャを回して旅先を決める！日本地図が光るワクワクの旅先抽選アプリ">
  <meta name="theme-color" content="#0b0d26">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff5fa2'/%3E%3Cpath d='M32 12l6 14 15 1-12 9 4 15-13-8-13 8 4-15-12-9 15-1z' fill='%23ffd54a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <header class="top">
    <h1 class="logo"><span class="logo-sub">TABI GACHA</span>旅ガチャ</h1>
    <button type="button" id="mute" class="icon-btn" aria-pressed="false" aria-label="効果音オフ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg>
    </button>
  </header>

  <main class="layout">
    <section class="stage" aria-label="抽選ステージ">
      <ol class="steps" id="steps" aria-label="進行状況">
        <li data-step="1">地域ルーレット</li>
        <li data-step="2">地域決定</li>
        <li data-step="3">都道府県ルーレット</li>
        <li data-step="4">行き先決定</li>
      </ol>
      <div class="map-frame" id="mapFrame">
        <div class="map-host" id="map"></div>
        <div class="rare-aura" aria-hidden="true"></div>
        <div class="banner" id="banner" aria-live="polite">
          <p class="banner-kicker" id="bannerKicker"></p>
          <p class="banner-text" id="bannerText"></p>
        </div>
      </div>
    </section>

    <aside class="side">
      <form class="panel settings" id="settings" aria-label="抽選の設定">
        <fieldset>
          <legend>住んでいる地域</legend>
          <div class="chips" id="residences"></div>
        </fieldset>
        <fieldset>
          <legend>旅先の距離</legend>
          <div class="segment" id="distances"></div>
        </fieldset>
      </form>

      <div class="controls">
        <button type="button" class="gacha-btn" id="action">
          <span class="gacha-btn-label" id="actionLabel">旅先を決める</span>
        </button>
        <p class="hint" id="hint">条件を選んで、ガチャを回そう！</p>
      </div>

      <section class="panel result" id="result" hidden aria-labelledby="resultName">
        <div class="result-head">
          <p class="result-kicker">あなたの旅先は…</p>
          <span class="badge" id="resultBadge" hidden>SSR</span>
        </div>
        <h2 class="result-name" id="resultName"></h2>
        <p class="result-region" id="resultRegion"></p>
        <p class="result-catch" id="resultCatch"></p>
        <div class="result-grid">
          <div><h3>観光地</h3><ul class="tags" id="resultSpots"></ul></div>
          <div><h3>温泉</h3><ul class="tags" id="resultOnsen"></ul></div>
          <div><h3>郷土料理</h3><ul class="tags" id="resultFoods"></ul></div>
        </div>
        <div class="result-actions">
          <button type="button" class="btn btn-primary" id="detailBtn">詳細を見る</button>
          <button type="button" class="btn btn-ghost" id="againBtn">もう一度引く</button>
        </div>
      </section>
    </aside>
  </main>

  <dialog class="detail" id="detail" aria-labelledby="detailTitle">
    <div class="detail-inner">
      <header class="detail-head">
        <div>
          <p class="detail-region" id="detailRegion"></p>
          <h2 id="detailTitle"></h2>
          <p class="detail-catch" id="detailCatch"></p>
        </div>
        <button type="button" class="icon-btn" id="detailClose" aria-label="閉じる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div id="detailBody"></div>
    </div>
  </dialog>

  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <footer class="foot">
    <p>地図出典：<a href="https://www.gsi.go.jp/kankyochiri/gm_jpn.html" target="_blank" rel="noopener noreferrer">地球地図日本（国土地理院）</a>を加工して作成 ／ 掲載情報は旅のきっかけです。お出かけ前に最新情報をご確認ください。</p>
  </footer>
</body>
</html>
