<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅ガチャ</title>
  <meta name="description" content="ガチャを回して旅先を決める！日本地図が光るワクワクの旅先抽選アプリ">
  <meta name="theme-color" content="#efe3c8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23d9502f'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23f7eed9' stroke-width='3' stroke-dasharray='4 3'/%3E%3Cpath d='M32 16l4.7 10.4 11.3 1.2-8.5 7.6 2.4 11.2L32 40.6l-9.9 5.8 2.4-11.2-8.5-7.6 11.3-1.2z' fill='%23f7eed9'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="airmail" aria-hidden="true"></div>

  <header class="top">
    <div class="logo-wrap">
      <p class="logo-sub">日本全国 旅先抽選所</p>
      <h1 class="logo">旅ガチャ</h1>
    </div>
    <button type="button" id="mute" class="icon-btn" aria-pressed="false" aria-label="効果音オフ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg>
    </button>
  </header>

  <main class="layout">
    <section class="stage" aria-label="抽選ステージ">
      <div class="map-frame" id="mapFrame">
        <span class="map-title" aria-hidden="true">JAPAN RAILWAY &amp; SEA ROUTES ── 日本旅行地図</span>
        <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46"/><circle cx="50" cy="50" r="36"/>
          <path class="needle" d="M50 8 58 50 50 92 42 50Z"/><path class="needle-n" d="M50 8 58 50H42Z"/>
          <path d="M8 50 50 44 92 50 50 56Z"/>
          <text x="50" y="6">N</text>
        </svg>
        <div class="map-host" id="map"></div>
        <div class="rare-aura" aria-hidden="true"></div>
        <div class="banner" id="banner" aria-live="polite">
          <p class="banner-kicker" id="bannerKicker"></p>
          <p class="banner-text" id="bannerText"></p>
        </div>
      </div>
    </section>

    <aside class="side">
      <form class="panel settings" id="settings" aria-label="抽選の設定">
        <label class="field">
          <span class="field-label">住んでいる地域</span>
          <span class="select-wrap"><select id="residence" name="residence"></select></span>
        </label>
        <fieldset>
          <legend class="field-label">旅先の距離</legend>
          <div class="segment" id="distances"></div>
        </fieldset>
      </form>

      <div class="controls">
        <button type="button" class="gacha-btn" id="action">
          <span class="gacha-btn-label" id="actionLabel">旅先を決める</span>
        </button>
        <p class="hint" id="hint">条件を選んで、ガチャを回そう！</p>
      </div>

      <section class="ticket result" id="result" hidden aria-labelledby="resultName">
        <div class="ticket-head">
          <span>旅ガチャ 乗車券</span>
          <span class="ticket-no" id="ticketNo"></span>
        </div>
        <div class="ticket-body">
          <p class="ticket-route">
            <span class="ticket-from" id="ticketFrom"></span>
            <span class="ticket-arrow" aria-hidden="true">▶</span>
            <span class="ticket-to"><strong class="result-name" id="resultName"></strong><small>ゆき</small></span>
          </p>
          <p class="result-region" id="resultRegion"></p>
          <p class="result-catch" id="resultCatch"></p>
          <div class="result-grid">
            <div><h3>観光地</h3><ul class="tags" id="resultSpots"></ul></div>
            <div><h3>温泉</h3><ul class="tags" id="resultOnsen"></ul></div>
            <div><h3>郷土料理</h3><ul class="tags" id="resultFoods"></ul></div>
          </div>
          <div class="result-actions">
            <button type="button" class="btn btn-primary" id="detailBtn">詳細を見る</button>
            <button type="button" class="btn btn-ghost" id="againBtn">もう一度引く</button>
          </div>
          <span class="stamp" id="resultBadge" hidden>SSR</span>
        </div>
        <div class="ticket-foot">
          <span id="ticketDate"></span>
          <span>片道・途中下車 大歓迎</span>
        </div>
      </section>
    </aside>
  </main>

  <dialog class="detail" id="detail" aria-labelledby="detailTitle">
    <div class="detail-inner">
      <header class="detail-head">
        <div>
          <p class="detail-region" id="detailRegion"></p>
          <h2 id="detailTitle"></h2>
          <p class="detail-catch" id="detailCatch"></p>
        </div>
        <button type="button" class="icon-btn" id="detailClose" aria-label="閉じる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div id="detailBody"></div>
    </div>
  </dialog>

  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <footer class="foot">
    <p>地図出典：<a href="https://www.gsi.go.jp/kankyochiri/gm_jpn.html" target="_blank" rel="noopener noreferrer">地球地図日本（国土地理院）</a>を加工して作成 ／ 掲載情報は旅のきっかけです。お出かけ前に最新情報をご確認ください。</p>
  </footer>
  <div class="airmail airmail-bottom" aria-hidden="true"></div>
</body>
</html>
